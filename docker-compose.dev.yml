services:
  vertex-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vertex-sentinel
    ports:
      - "${PORT:-3006}:3006"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./agent-id.json:/app/agent-id.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3006/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    name: sentinel-network
